name: CI

# Push- and PR-triggered gate, mirroring dep-guard's ci.yml. conductor is a
# single package with no other repository depending on it, so there is no
# separate release-time re-verification of these same gates beyond what
# release.yml already runs before publish.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Refuse pull requests with bot co-author trailers
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        pattern='^Co-authored-by:.*(cursoragent@cursor\.com|noreply@anthropic\.com|\[bot\])'
        commits_json="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" | jq -s 'add')"
        count="$(echo "$commits_json" | jq 'length')"
        failures=0
        while IFS= read -r commit; do
          sha="$(echo "$commit" | jq -r '.sha')"
          message="$(echo "$commit" | jq -r '.commit.message')"
          trailer="$(printf '%s\n' "$message" | grep -iE "$pattern" || true)"
          if [ -n "$trailer" ]; then
            echo "Offending commit: $sha"
            echo "Trailer: $trailer"
            echo "Co-author trailers from editor agents put a bot account in the contributors graph; remove the trailer with git commit --amend and re-push."
            failures=1
          fi
        done < <(echo "$commits_json" | jq -c '.[]')
        if [ "$failures" -eq 1 ]; then
          exit 1
        fi
        echo "Checked $count commit(s) for bot co-author trailers; none found."

    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Typecheck
      run: pnpm typecheck

    - name: Lint (public repository hygiene guard)
      run: pnpm lint

    - name: Run tests
      run: pnpm test
